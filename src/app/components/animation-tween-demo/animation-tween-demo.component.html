<mat-card>
  <mat-card-header>
    <mat-card-title>Animation Tween</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <gve-animation-tween
      [tween]="tween()"
      (tweenChange)="onTweenChange($event!)"
    />
    <hr />
    <div>
      <code>
        <pre>{{ tween() | json }}</pre>
      </code>
    </div>
  </mat-card-content>
</mat-card>
