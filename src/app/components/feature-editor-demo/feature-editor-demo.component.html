<mat-card>
  <mat-card-header>
    <mat-card-title>Feature Editor</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <fieldset>
      <legend>presets</legend>
      <mat-checkbox [formControl]="hasFeatNames">feature names</mat-checkbox>
      <mat-checkbox [formControl]="hasFeatValues">feature values</mat-checkbox>
    </fieldset>
    <hr />
    <gve-feature-editor
      [featNames]="featNames()"
      [featValues]="featValues()"
      [feature]="feature()"
      (featureChange)="onFeatureChange($event)"
    />
    <hr />
    @if (feature()) {
    <div>
      <code>
        <pre>{{ feature() | json }}</pre>
      </code>
    </div>
    }
  </mat-card-content>
</mat-card>
