<mat-card>
  <mat-card-header>
    <mat-card-title>Base Text Peephole</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <div>
      <mat-form-field class="long-text">
        <label>text</label>
        <textarea matInput [formControl]="text" rows="5"></textarea>
      </mat-form-field>
    </div>

    <div class="controls-row">
      <mat-form-field class="nr">
        <mat-label>at</mat-label>
        <input matInput [formControl]="at" type="number" min="0" />
      </mat-form-field>

      <mat-checkbox [formControl]="atAsIndex">idx</mat-checkbox>

      <mat-form-field class="nr">
        <mat-label>run</mat-label>
        <input matInput [formControl]="run" type="number" min="0" />
      </mat-form-field>

      <mat-form-field class="nr">
        <mat-label>window width</mat-label>
        <input matInput [formControl]="windowWidth" type="number" min="1" />
      </mat-form-field>

      <mat-form-field class="nr">
        <mat-label>em size</mat-label>
        <input
          matInput
          [formControl]="emSize"
          type="number"
          min="0.5"
          step="0.1"
        />
      </mat-form-field>
    </div>

    <hr />

    <gve-text-peephole
      [text]="nodes()"
      [selectedRange]="selectedRange()"
      [windowWidth]="windowWidthValue()"
      [emSize]="emSizeValue()"
    />
  </mat-card-content>
</mat-card>
