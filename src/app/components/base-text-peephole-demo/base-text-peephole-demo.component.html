<mat-card>
  <mat-card-header>
    <mat-card-title>Base Text Peephole</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <div>
      <mat-form-field class="long-text">
        <label>text</label>
        <textarea matInput [formField]="form.text" rows="5"></textarea>
      </mat-form-field>
    </div>

    <div class="controls-row">
      <mat-form-field class="nr">
        <mat-label>at</mat-label>
        <input matInput [formField]="form.at" type="number" />
      </mat-form-field>

      <mat-checkbox [formField]="form.atAsIndex">idx</mat-checkbox>

      <mat-form-field class="nr">
        <mat-label>run</mat-label>
        <input matInput [formField]="form.run" type="number" />
      </mat-form-field>

      <mat-form-field class="nr">
        <mat-label>window width</mat-label>
        <input matInput [formField]="form.windowWidth" type="number" />
      </mat-form-field>

      <mat-form-field class="nr">
        <mat-label>em size</mat-label>
        <input
          matInput
          [formField]="form.emSize"
          type="number"
          step="0.1"
        />
      </mat-form-field>
    </div>

    <hr />

    <gve-text-peephole
      [text]="nodes()"
      [selectedRange]="selectedRange()"
      [windowWidth]="windowWidthValue()"
      [emSize]="emSizeValue()"
    />
  </mat-card-content>
</mat-card>
