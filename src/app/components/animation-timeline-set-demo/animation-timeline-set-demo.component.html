<mat-card>
  <mat-card-header>
    <mat-card-title>Animation Timelines Set</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <gve-animation-timeline-set
      [tags]="tags"
      [elementIds]="elementIds"
      [timelines]="timelines()"
      (timelinesChange)="onTimelinesChange($event)"
    />
    <hr />
    <div>
      <code>
        <pre>{{ timelines() | json }}</pre>
      </code>
    </div>
  </mat-card-content>
</mat-card>
