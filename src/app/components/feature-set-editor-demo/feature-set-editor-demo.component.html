<mat-card>
  <mat-card-header>
    <mat-card-title>Features Set Editor</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <fieldset>
      <legend>presets</legend>
      <mat-checkbox [formControl]="hasFeatNames">feature names</mat-checkbox>
      <mat-checkbox [formControl]="hasFeatValues">feature values</mat-checkbox>
      <mat-form-field style="width: 7em; margin-left: 8px">
        <mat-label>filter tr.</mat-label>
        <input matInput type="number" [formControl]="filterThreshold" min="-1" />
      </mat-form-field>
    </fieldset>
    <hr />
    <gve-feature-set-editor
      [featNames]="featNames"
      [featValues]="featValues"
      [filterThreshold]="filterThreshold.value"
      [features]="features"
      (featuresChange)="onFeaturesChange($event)"
    />
    <hr />
    @if (features.length) {
    <div>
      <code>
        <pre>{{ features | json }}</pre>
      </code>
    </div>
    }
  </mat-card-content>
</mat-card>
