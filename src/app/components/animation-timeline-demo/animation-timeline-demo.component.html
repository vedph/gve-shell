<mat-card>
  <mat-card-header>
    <mat-card-title>Animation Timeline</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <gve-animation-timeline
      [timeline]="timeline()"
      (timelineChange)="onTimelineChange($event!)"
    />
    <hr />
    <div>
      <code>
        <pre>{{ timeline() | json }}</pre>
      </code>
    </div>
  </mat-card-content>
</mat-card>
