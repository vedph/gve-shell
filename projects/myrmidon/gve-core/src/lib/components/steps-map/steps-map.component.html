<div>
  @if (steps().length) {
    @for (step of steps(); track step.outputTag) {
      <div
        matRipple
        class="step form-row"
        [class.selected]="step === selectedStep()"
        (click)="onStepClick(step)"
      >
        <!-- tag -->
        <div class="tag">
          <span class="muted-tag">{{ step.inputTag }} &#x25b6; </span>
          {{ step.outputTag }}
          <button
            type="button"
            mat-icon-button
            class="copy-btn"
            matTooltip="Copy text"
            (click)="copyText(step, $event)"
            aria-label="Copy text"
          >
            <mat-icon>content_copy</mat-icon>
          </button>
        </div>
        <!-- text lines -->
        <div class="text" [style.fontSize]="textFontSize()">
          @for (line of lines()[step.outputTag]; track $index) {
            <p class="line">{{ line }}</p>
          }
        </div>
      </div>
    }
  }
</div>
