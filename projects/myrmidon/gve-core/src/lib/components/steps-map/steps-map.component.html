<div>
  @if (steps().length) { @for (step of steps(); track step.outputTag) {
  <div
    matRipple
    class="step form-row"
    [ngClass]="{ selected: step === selectedStep() }"
    (click)="onStepClick(step)"
  >
    <!-- tag -->
    <div class="tag">
      <span class="muted-tag">{{ step.inputTag }} &#x25b6; </span>
      {{ step.outputTag }}
    </div>
    <!-- text lines -->
    <div class="text" [style.fontSize]="textFontSize()">
      @for (line of lines[step.outputTag]; track $index) {
      <div class="line">{{ line }}</div>
      }
      <div></div>
    </div>
  </div>
  } }
</div>
