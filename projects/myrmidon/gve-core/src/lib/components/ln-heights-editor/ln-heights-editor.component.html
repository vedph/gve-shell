@if (lineNumbers().length) {
  <div class="form-row">
    <!-- line number -->
    <mat-form-field class="input-nr">
      <mat-label>line</mat-label>
      <mat-select [formControl]="lineNumber">
        @for (n of lineNumbers(); track n) {
          <mat-option [value]="n">
            {{ n }}
          </mat-option>
        }
      </mat-select>
    </mat-form-field>

    <!-- height -->
    @if (lineNumber.value) {
      <mat-form-field class="input-nr">
        <mat-label>height</mat-label>
        <input matInput type="number" [formControl]="height" min="0" />
      </mat-form-field>
    }

    <!-- reset button -->
    <button
      type="button"
      mat-icon-button
      color="warn"
      (click)="reset()"
      matTooltip="Remove all the heights"
      >
      <mat-icon class="mat-warn">clear</mat-icon>
    </button>
  </div>
}
