<div [style.padding]="dialogRef ? '8px' : '0'">
  @if (dialogRef) {
  <div id="heading">
    <h2>Set Base Text</h2>
  </div>
  }
  <form [formGroup]="form" (submit)="save()">
    <fieldset>
      <div id="batch-input">
        <div>
          <mat-form-field class="full-width">
            <mat-label>base text</mat-label>
            <textarea matInput [formControl]="userText" rows="8"></textarea>
            @if ($any(userText).errors?.required && (userText.dirty ||
            userText.touched)) {
            <mat-error>text required</mat-error>
            } @if ($any(userText).errors?.maxLength && (userText.dirty ||
            userText.touched)) {
            <mat-error>text too long</mat-error>
            }
          </mat-form-field>
        </div>
      </div>
      <div class="form-row-center">
        @if (dialogRef) {
        <button
          type="button"
          class="mat-warn"
          mat-flat-button
          matTooltip="Close dialog"
          (click)="close()"
        >
          close
        </button>
        }
        <button
          type="button"
          class="mat-primary"
          mat-flat-button
          matTooltip="Set base text"
          [disabled]="form.invalid"
          (click)="save()"
        >
          set
        </button>
      </div>
    </fieldset>
  </form>
</div>
