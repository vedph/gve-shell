<div [style.padding]="dialogRef ? '8px' : '0'">
  @if (dialogRef) {
    <div id="heading">Set Base Text</div>
  }
  <form [formGroup]="form" (submit)="save()">
    <fieldset>
      <div id="batch-input">
        <div>
          <mat-form-field class="full-width">
            <label>base text</label>
            <textarea matInput [formControl]="userText" rows="8"></textarea>
            @if (
              $any(userText).errors?.required &&
              (userText.dirty || userText.touched)
            ) {
              <mat-error>text required</mat-error>
            }
            @if (
              $any(userText).errors?.maxLength &&
              (userText.dirty || userText.touched)
            ) {
              <mat-error>text too long</mat-error>
            }
          </mat-form-field>
        </div>
      </div>
      <div class="form-row-center">
        @if (dialogRef) {
          <button
            type="button"
            class="mat-warn"
            mat-flat-button
            matTooltip="Close dialog"
            (click)="close()"
          >
            close
          </button>
        }
        <button
          type="button"
          class="mat-primary"
          mat-flat-button
          matTooltip="Copy JSON to clipboard"
          [disabled]="form.invalid"
          (click)="copyToClipboard()"
        >
          JSON
        </button>
        <button
          type="button"
          class="mat-primary"
          mat-flat-button
          matTooltip="Set base text"
          [disabled]="form.invalid"
          (click)="save()"
        >
          set
        </button>
      </div>
    </fieldset>
  </form>
</div>
