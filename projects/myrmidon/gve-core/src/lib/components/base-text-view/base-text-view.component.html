<!-- Toolbar -->
<div class="toolbar">
  <mat-form-field appearance="outline" class="search-field">
    <input
      matInput
      [ngModel]="searchQuery()"
      (ngModelChange)="onSearchInput($event)"
      placeholder="search"
    />
    @if (searchQuery()) {
      <button
        type="button"
        matSuffix
        mat-icon-button
        matTooltip="Clear search"
        (click)="clearSearch()"
      >
        <mat-icon class="mat-warn">close</mat-icon>
      </button>
    }
  </mat-form-field>

  @if (isSearchActive()) {
    <span class="match-count" [class.no-matches]="matchCount() === 0">
      {{ matchCount() }}
    </span>
  }

  <button
    type="button"
    mat-stroked-button
    matTooltip="Copy selection text to clipboard"
    [disabled]="!hasSelection()"
    (click)="copySelection()"
  >
    <mat-icon>content_copy</mat-icon>
    copy
  </button>

  <button
    type="button"
    mat-stroked-button
    matTooltip="Copy selection coordinates to clipboard"
    [disabled]="!hasSelection()"
    (click)="copyCoordinates()"
  >
    <mat-icon>pin_drop</mat-icon>
    copy coords
  </button>

  <button
    type="button"
    mat-stroked-button
    [class.active]="showIndex()"
    [matTooltip]="showIndex() ? 'Show character IDs' : 'Show character indexes'"
    (click)="toggleShowIndex()"
  >
    <mat-icon>{{ showIndex() ? 'tag' : 'numbers' }}</mat-icon>
    {{ showIndex() ? 'index' : 'id' }}
  </button>

  @if (pickedIds()) {
    <span class="picked-ids" matTooltip="Double-clicked character IDs">{{ pickedIds() }}</span>
    <button
      type="button"
      mat-icon-button
      matTooltip="Clear collected IDs"
      (click)="clearPickedIds()"
    >
      <mat-icon>clear</mat-icon>
    </button>
    <button
      type="button"
      mat-icon-button
      matTooltip="Copy collected IDs to clipboard"
      (click)="copyPickedIds()"
    >
      <mat-icon>content_copy</mat-icon>
    </button>
  }
</div>

<!-- Text display -->
<div id="text" tabindex="0" (keydown)="onKeyDown($event)">
  @for (line of lines(); track $index) {
    <div class="line">
      @if (hasLineNumber()) {
        <div class="nr">
          {{ lines().indexOf(line) + 1 }}
        </div>
      }
      @for (c of line; track c.id) {
        <gve-base-text-char [char]="c" [showIndex]="showIndex()" (charPick)="onCharPick($event)" (charDblPick)="onCharDblPick($event)" />
      }
    </div>
  }
</div>
