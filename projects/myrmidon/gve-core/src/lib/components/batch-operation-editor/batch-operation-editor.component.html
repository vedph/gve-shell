<div [style.padding]="dialogRef ? '8px' : '0'">
  @if (dialogRef) {
    <div id="heading">Add Operations</div>
  }
  <div id="batch-input">
    <div>
      <mat-form-field class="full-width">
        <mat-label>operations</mat-label>
        <textarea
          class="code"
          matInput
          [formField]="form.inputOps"
          rows="8"
          spellcheck="false"
        ></textarea>
      </mat-form-field>
      @if (parseError()) {
        <div class="error">{{ parseError() }}</div>
      }
    </div>
  </div>

  <div class="form-row-center">
    @if (dialogRef) {
      <button
        type="button"
        class="mat-warn"
        mat-flat-button
        matTooltip="Close dialog"
        (click)="close()"
      >
        close
      </button>
    }
    <button
      type="button"
      class="mat-primary"
      mat-flat-button
      matTooltip="Parse text into operations"
      [disabled]="!form.inputOps().value() || busy()"
      (click)="parseOperations(form.inputOps().value())"
    >
      batch add
    </button>
  </div>
</div>
